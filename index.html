<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Terrain Editor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; z-index: 10; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 40px); overflow-y: auto; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-weight: bold; font-size: 0.9em; }
        .control-group input[type="range"] { width: 150px; cursor: pointer; }
        .button-group { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap;} 
        .button-group button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background-color: #555; color: white; transition: background-color 0.2s ease; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; } 
        .button-group button.active { background-color: #4682B4; box-shadow: 0 0 5px #4682B4; }
        .button-group button:hover:not(.active) { background-color: #777; }
        .tool-icon { width: 16px; height: 16px; fill: white; }
        .slider-value { font-size: 0.8em; color: #ccc; margin-left: 5px; }
        #flattenHeightControl { display: none; } 
        #colorPickerControl { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .color-swatch { width: 25px; height: 25px; border-radius: 4px; cursor: pointer; transition: transform 0.1s ease; border: 1px solid rgba(255, 255, 255, 0.2); } 
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.active { box-shadow: 0 0 0 2px white; transform: scale(1.1); }
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(25px, 1fr)); gap: 5px; max-width: 160px; } 
        #players-list { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; z-index: 10; max-height: 300px; overflow-y: auto; width: 200px; } 
        #players-list h3 { margin-top: 0; margin-bottom: 10px; font-size: 1em; }
        .player-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .player-avatar { width: 24px; height: 24px; border-radius: 50%; }
        .player-name { font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; } 
        #save-status { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 8px; font-size: 0.9em; opacity: 0; transition: opacity 0.3s ease; z-index: 11; } 
    </style>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <label for="brushSize">Brush Size: <span id="brushSizeValue" class="slider-value">5</span></label>
            <input type="range" id="brushSize" name="brushSize" min="1" max="30" value="5">
        </div>
        <div class="control-group">
            <label for="brushStrength">Brush Strength: <span id="brushStrengthValue" class="slider-value">1.0</span></label>
            <input type="range" id="brushStrength" name="brushStrength" min="0.1" max="5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Tool:</label>
            <div class="button-group">
                <button id="selectionBtn" data-tool="select" title="Select & Navigate">
                    <svg class="tool-icon" viewBox="0 0 24 24">
                        <path d="M7,2l12,11.2l-5.8,0.5l3.3,7.3l-2.2,1l-3.2-7.4L7,18.5V2"/>
                    </svg>
                    Select
                </button>
                <button id="raiseBtn" class="active" data-tool="raise" title="Raise Terrain">
                    <svg class="tool-icon" viewBox="0 0 24 24">
                        <path d="M12,20V10.8l5.5,5.5l1.42-1.42L12,8L5.08,14.92l1.42,1.42L12,10.8V20z"/>
                    </svg>
                    Raise
                </button>
                <button id="lowerBtn" data-tool="lower" title="Lower Terrain">
                    <svg class="tool-icon" viewBox="0 0 24 24">
                        <path d="M12,4v9.2l-5.5-5.5L5.08,9.12L12,16l6.92-6.92l-1.42-1.42L12,13.2V4z"/>
                    </svg>
                    Lower
                </button>
                <button id="flattenBtn" data-tool="flatten" title="Flatten Terrain">
                    <svg class="tool-icon" viewBox="0 0 24 24">
                        <path d="M5,11h14v2H5z"/>
                    </svg>
                    Flatten
                </button>
                 <button id="colorBtn" data-tool="color" title="Paint Terrain">
                    <svg class="tool-icon" viewBox="0 0 24 24" fill="currentColor">
                         <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5.67-1.5 1.5S5.67 15 6.5 15 8 14.33 8 13.5 7.33 12 6.5 12zm3-4c-.83 0-1.5.67-1.5 1.5S8.67 11 9.5 11s1.5-.67 1.5-1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5.67-1.5 1.5S13.67 11 14.5 11s1.5-.67 1.5-1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5.67-1.5 1.5S16.67 15 17.5 15s1.5-.67 1.5-1.5S18.33 12 17.5 12z"/>
                    </svg>
                    Paint
                </button>
            </div>
        </div>
        <div class="control-group" id="flattenHeightControl">
            <label for="flattenHeight">Flatten Height: <span id="flattenHeightValue" class="slider-value">0.0</span></label>
            <input type="range" id="flattenHeight" name="flattenHeight" min="-20" max="40" step="0.5" value="0">
        </div>
        <div class="control-group" id="colorPickerControl">
            <label>Terrain Color:</label>
            <div class="color-grid" id="colorSwatches">
                <!-- Swatches added by JS -->
            </div>
        </div>
    </div>
    <div id="players-list">
        <h3>Active Players</h3>
        <div id="players-container">
             <!-- Player list added by JS -->
        </div>
    </div>
    <div id="save-status">Saving changes...</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>

</body>
</html>
