<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Terrain Editor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
        #controls label, #controls input, #controls button { display: block; margin-bottom: 5px; }
        #controls input[type="range"] { width: 100%; }
        #controls button { padding: 5px 10px; cursor: pointer; }
        #controls button.active { background-color: #55aaff; color: white; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="brushSize">Brush Size:</label>
        <input type="range" id="brushSize" name="brushSize" min="1" max="20" value="5">
        <label for="brushStrength">Brush Strength:</label>
        <input type="range" id="brushStrength" name="brushStrength" min="0.1" max="5" step="0.1" value="1">
        <div>
            <button id="raiseBtn" class="active">Raise</button>
            <button id="lowerBtn">Lower</button>
            <button id="flattenBtn">Flatten</button> <!-- Added Flatten button -->
        </div>
         <label for="flattenHeight">Flatten Height:</label> <!-- Added Flatten Height Slider -->
        <input type="range" id="flattenHeight" name="flattenHeight" min="-10" max="30" step="0.5" value="0">
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>

</body>
</html>
